name: Supabase Keep Alive 24/7

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (Read-Only Activity Keep-Alive)
        run: |
          echo "Pinging Supabase database to maintain 24/7 active status..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXRyb3Z5eGFkYXpwa2Z5c2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjA0NjQsImV4cCI6MjA5NTY5NjQ2NH0.6voV594ZPcE3UVqNmrPhuCk_m2h0DSZtKQUCumBenK8" \
            "https://zbitrovyxadazpkfysas.supabase.co/rest/v1/")
          
          echo "Supabase Response Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "SUCCESS: Supabase database is active and responsive!"
          else
            echo "WARNING: Received status code $HTTP_STATUS"
          fi
